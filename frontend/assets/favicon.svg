<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- warm cream background -->
  <rect width="32" height="32" rx="7" fill="#fdf5e8"/>
  <!-- subtle pink inner glow ring -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#f4a9c9" stroke-width="1.5"/>
  <!-- H monogram: burgundy stems with pink crossbar accent -->
  <!-- left stem -->
  <rect x="7" y="6" width="4.5" height="20" rx="2" fill="#6e1748"/>
  <!-- right stem -->
  <rect x="20.5" y="6" width="4.5" height="20" rx="2" fill="#6e1748"/>
  <!-- crossbar (pink accent) -->
  <rect x="7" y="13.5" width="18" height="5" rx="2.5" fill="#e0568f"/>
</svg>