<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- warm cream rounded-square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#fdf6ec"/>
  <!-- subtle burgundy border -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="none" stroke="#6e1748" stroke-width="2.5"/>
  <!-- H monogram: two vertical bars + crossbar -->
  <!-- left vertical bar -->
  <rect x="13" y="14" width="11" height="36" rx="3" fill="#6e1748"/>
  <!-- right vertical bar -->
  <rect x="40" y="14" width="11" height="36" rx="3" fill="#6e1748"/>
  <!-- crossbar (pink accent) -->
  <rect x="13" y="28" width="38" height="8" rx="3" fill="#e0568f"/>
</svg>