<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Textbook vs. Her</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- bow drawing, reused by the receipts -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="bow">
      <path d="M32 20 C22 4 4 2 3 18 C2 33 21 36 32 20Z" />
      <path d="M32 20 C42 4 60 2 61 18 C62 33 43 36 32 20Z" />
      <path d="M30 24 L22 38 L28 36 L32 26Z" />
      <path d="M34 24 L42 38 L36 36 L32 26Z" />
      <circle cx="32" cy="20" r="4.5" />
    </symbol>
  </svg>

  <header class="site-header">
    <h1>Textbook vs. Her</h1>
    <ol class="steps" aria-label="Your progress">
      <li aria-current="step">KNOW</li>
      <li>MATCH</li>
      <li>ACT</li>
    </ol>
  </header>

  <main id="app">
    <p>Atlas coming soon.</p>

    <section class="news" aria-labelledby="news-title">
      <p class="eyebrow">Current news</p>
      <h2 id="news-title">Women's health in the news</h2>
      <ul class="receipt-grid" id="news-list"></ul>
    </section>
  </main>

  <dialog id="receipt-dialog" class="receipt-dialog"></dialog>

  <footer class="site-footer">
    Educational information, not medical advice. If you're worried or something feels very wrong, seek care now. In an emergency, call your local emergency number (112 in India).
  </footer>

  <script type="module" src="config.js"></script>
  <script type="module" src="components/news.js"></script>
</body>
</html>
