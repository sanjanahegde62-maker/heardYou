spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/heardYou}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
# show-sql and format_sql are disabled to prevent Hibernate from logging query bind
# parameters (which would include submitted symptom slugs) to application logs.
# Enable only in a local development profile, never in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
